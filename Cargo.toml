[package]
name = "beve"
version = "10.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Rust implementation of the BEVE (Binary Efficient Versatile Encoding) specification with serde support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beve-org/beve-rs"
homepage = "https://github.com/beve-org/beve-rs"
readme = "README.md"
# `dev/` holds design notes written against the implementation as it stood when
# each was drafted, so they date as the code moves and are not reference docs for
# a consumer. `docs/` is the published reference material; keep these out of the
# `.crate`.
#
# `tests/cpp/` holds the C++ fixtures `build.rs` compiles for the Glaze interop
# tests. They are useless to a consumer: the Glaze headers they
# `#include` live in `reference/`, which is gitignored and never ships. Worse
# than useless, in fact — `build.rs` skips the helpers when the sources are gone,
# but if they ship without the headers it instead tries to compile them, fails,
# and warns every downstream build that lacks a C++23 compiler.
# `/fuzz/` holds the libFuzzer targets. It is a package of its own, which cargo
# skips when building this one's `.crate` -- so the two things the published
# `tests/fuzz_seeds.rs` needs, the target bodies and the seed corpus, live under
# `tests/fuzz/` where they ship with it.
#
# The leading slash matters: these are gitignore-style globs, so a bare `fuzz/`
# means "any directory named fuzz, at any depth" and would take `tests/fuzz/`
# with it -- silently, since the seeds would just stop shipping.
exclude = ["dev/", "tests/cpp/", "/fuzz/"]

# Both `mat` and `num-complex` are off by default, and docs.rs builds a crate
# with its default features unless told otherwise — which rendered the whole
# `mat` module invisible there through 7.0.0. Build the docs with every feature
# on so the MATLAB export API and the `num_complex` impls are documented. Safe
# to turn on: neither dependency needs system libraries.
#
# `--cfg docsrs` goes with it, so feature-gated items carry an "Available on
# crate feature" badge instead of looking unconditional.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Lean core by default. The `mat` feature (MATLAB v7.3 / HDF5 file interop) is
# opt-in because it pulls in `hdf5-pure` and its compression stack
# (flate2/miniz_oxide/crc32fast), which the core BEVE ser/de does not need.
default = []
mat = ["dep:hdf5-pure", "hdf5-pure/serde"]
# `ComplexElement` impls for `num_complex::Complex<T>`, so the bulk complex-array
# helpers take those slices directly; the orphan rule puts them here rather than
# in a caller. The two upstream features come along because the helpers' bounds
# demand them and a caller cannot add either impl either: `bytemuck` for the
# decode's `AnyBitPattern`, `serde` for the `Serialize`/`Deserialize` the
# `complex_array::*` modules require.
num-complex = ["dep:num-complex", "num-complex/bytemuck", "num-complex/serde"]

[dependencies]
serde = { version = "1", features = ["derive"] }
half = { version = "2.4", features = ["serde"] }
# Bounds the bulk `complex_array::*` decode path: only types where every bit
# pattern is a valid value (`AnyBitPattern`) may be memcpy'd from wire bytes.
bytemuck = "1"
simdutf8 = "0.1"
hdf5-pure = { version = "0.41", optional = true }
# 0.4.1, not 0.4: the `bytemuck` feature turned on above did not exist in 0.4.0,
# so a consumer locked there fails at resolve time.
num-complex = { version = "0.4.1", optional = true, default-features = false }

# Normal dependencies are already in scope for tests, benches, and examples, so
# `serde`, `half`, and `bytemuck` are deliberately not repeated here; listing
# them again only duplicates the version and feature set in a second place that
# can drift out of step with the real one above.
[dev-dependencies]
serde_json = "1"
# The bench harness. No transitive dependencies, where criterion's defaults
# dragged in the plotters and rayon stacks for an HTML report nothing here
# reads. It also interleaves a group's cases in rounds rather than running each
# to completion, so the A/B ratios these benches exist to read survive a run on
# a machine that is doing something else at the time.
benchit = "0.1"
# `hdf5-pure` is not a dev-dependency: the only test that uses it directly
# (`tests/mat_v73.rs`) is gated behind `#[cfg(feature = "mat")]`, and enabling
# `mat` turns on the optional `hdf5-pure` dependency, which is then nameable from
# the integration test. So a mat-off `cargo test` pulls in no HDF5 stack at all.

[[bin]]
name = "beve-cli"

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "serialized_size"
harness = false

[[bench]]
name = "streaming_bulk_decode"
harness = false

[[bench]]
name = "serde_int_decode"
harness = false

[[bench]]
name = "serde_with_decode"
harness = false

# Keep `target/` small during development: the incremental cache and debuginfo
# dominate a dev build here, and macOS charges debuginfo once per test binary.
# `line-tables-only` keeps file and line in panics and backtraces, dropping what
# only an attached debugger reads; `RUSTFLAGS="-C debuginfo=2"` restores it for a
# run. `release` and `bench` already skip incremental.
[profile.dev]
incremental = false
debug = "line-tables-only"

# Dependency debuginfo, useful only when stepping into serde or the bench harness.
# beve's own frames keep their line numbers; this key covers dependencies only.
[profile.dev.package."*"]
debug = 0
