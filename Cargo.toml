[package]
name = "beve"
version = "7.0.1"
edition = "2024"
rust-version = "1.89"
description = "Rust implementation of the BEVE (Binary Efficient Versatile Encoding) specification with serde support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beve-org/beve-rs"
homepage = "https://github.com/beve-org/beve-rs"
readme = "README.md"
# `dev/` holds design notes written against the implementation as it stood when
# each was drafted, so they date as the code moves and are not reference docs for
# a consumer. `docs/` is the published reference material; keep these out of the
# `.crate`.
#
# `tests/cpp/` holds the C++ fixtures `build.rs` compiles for the Glaze interop
# tests. They are useless to a consumer: the Glaze headers they
# `#include` live in `reference/`, which is gitignored and never ships. Worse
# than useless, in fact — `build.rs` skips the helpers when the sources are gone,
# but if they ship without the headers it instead tries to compile them, fails,
# and warns every downstream build that lacks a C++23 compiler.
exclude = ["dev/", "tests/cpp/"]

# `mat` is off by default, and docs.rs builds a crate with its default features
# unless told otherwise — which rendered the whole `mat` module invisible there
# through 7.0.0. Build the docs with every feature on so the MATLAB export API
# is documented. Safe to turn on: `mat`'s only dependency is `hdf5-pure`, which
# is pure Rust and needs no system libraries.
[package.metadata.docs.rs]
all-features = true

[features]
# Lean core by default. The `mat` feature (MATLAB v7.3 / HDF5 file interop) is
# opt-in because it pulls in `hdf5-pure` and its compression stack
# (flate2/miniz_oxide/crc32fast), which the core BEVE ser/de does not need.
default = []
mat = ["dep:hdf5-pure", "hdf5-pure/serde"]

[dependencies]
serde = { version = "1", features = ["derive"] }
half = { version = "2.4", features = ["serde"] }
# Bounds the bulk `complex_array::*` decode path: only types where every bit
# pattern is a valid value (`AnyBitPattern`) may be memcpy'd from wire bytes.
bytemuck = "1"
simdutf8 = "0.1"
hdf5-pure = { version = "0.34", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = "0.5"
proptest = "1.4"
# Already a normal dependency; named in dev too so tests can construct f16/bf16
# values to exercise the half-float typed-array paths.
half = { version = "2.4", features = ["serde"] }
# Dev too, so tests can mark a foreign `#[repr(C)]` complex element type as
# `AnyBitPattern` (the bound the bulk complex-array decode requires).
bytemuck = "1"
# `hdf5-pure` is not a dev-dependency: the only test that uses it directly
# (`tests/mat_v73.rs`) is gated behind `#[cfg(feature = "mat")]`, and enabling
# `mat` turns on the optional `hdf5-pure` dependency, which is then nameable from
# the integration test. So a mat-off `cargo test` pulls in no HDF5 stack at all.

[[bin]]
name = "beve-cli"

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "serialized_size"
harness = false

[[bench]]
name = "streaming_bulk_decode"
harness = false

[[bench]]
name = "serde_int_decode"
harness = false

[[bench]]
name = "serde_with_decode"
harness = false
